name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pr-pytest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Unit, Integration, Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
      MPLBACKEND: Agg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install pytest pytest-cov "torch==2.4.*" "numpy>=2,<3" "pandas>=2.3" "scikit-learn>=1.4" "matplotlib>=3.8" "pillow>=10.2" "pyyaml>=6.0" "tqdm>=4.66"

      - name: Run unit tests
        run: python -m pytest -m unit --no-cov

      - name: Run integration tests
        run: python -m pytest -m integration --no-cov

      - name: Run full suite with coverage gate
        run: python -m pytest
